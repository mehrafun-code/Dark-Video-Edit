name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force app/bin | Out-Null
          $exe = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName app/bin/ffmpeg.exe
          app/bin/ffmpeg.exe -version
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --windowed
          --name DarkVideoEdit --icon icon.ico
          --add-data "app/ui;ui" --add-data "app/assets;assets" --add-data "app/bin;bin"
          --collect-all imageio_ffmpeg --collect-all yt_dlp
          app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DarkVideoEdit-windows
          path: dist/DarkVideoEdit
